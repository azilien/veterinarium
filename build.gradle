// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.5.0'
group = 'com.veterinarium'

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.enabledGameTestNamespaces', 'veterinarium'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'veterinarium', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.14')
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

// Auto-sync vers instance Prism Veterinarium (pour tester en lançant Prism sans commande)
def prismModsDir = System.getProperty("user.home") + "/.local/share/PrismLauncher/instances/Veterinarium/.minecraft/mods"
tasks.register("copyToPrism") {
    notCompatibleWithConfigurationCache("utilise fileTree + copy à l'exécution")
    dependsOn("jar")
    doLast {
        def prismMods = file(prismModsDir)
        if (prismMods.exists()) {
            prismMods.listFiles()?.findAll { it.name.startsWith("veterinarium-") && it.name.endsWith(".jar") }?.each { it.delete() }
            def jarFile = tasks.named("jar").get().archiveFile.get().getAsFile()
            copy {
                from jarFile
                into prismMods
            }
            println(">>> Veterinarium sync Prism: " + prismMods + " -> " + jarFile.name)
        } else {
            println(">>> Prism instance non trouvée: " + prismModsDir)
        }
    }
}
tasks.named("build") { finalizedBy("copyToPrism") }
tasks.named("jar") { finalizedBy("copyToPrism") }
