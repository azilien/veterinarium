description='''Veterinarium — Le mod survie hardcore ou tu ne domptes plus les creatures, tu les SOIGNES.

Trouve des creatures blessees (dragons, dinos, loups), opere-les sur la Table de Bloc Operatoire, analyse leur pathologie sur la Table d'Analyse, puis assigne-les a ta colonie comme travailleurs.

Parfait pour les fans de Ice & Fire, MineColonies, Ars Nouveau et Ark.
- Bloc Operatoire & Table d'Analyse
- Scalpel, Kit de Suture, Seringue, Dossier Medical (Bestiaire Medical)
- Mecanique de soin : heal + tame + metier de colonie
- Compatible survie Hardcore & Multijoueur

Pour Asfax.
'''

